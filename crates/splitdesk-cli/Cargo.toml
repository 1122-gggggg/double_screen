[package]
name = "splitdesk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SplitDesk command-line client for the local daemon"

[lib]
name = "splitdesk_cli"
path = "src/lib.rs"

[[bin]]
name = "splitdesk"
path = "src/main.rs"

[dependencies]
splitdesk-core.workspace = true
splitdesk-session.workspace = true
splitdeskd = { path = "../splitdeskd" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
