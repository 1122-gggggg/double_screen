name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

# CPU runners only. GPU tests are #[ignore = "requires-gpu"].
# Do not run cargo test -- --ignored.
# Do not install fake NVIDIA/DXGI/PipeWire devices, dummy kernel
# modules, or software NVENC stubs to make those tests pass.

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Install Weston module build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libwayland-dev libweston-13-dev

      - name: Build Weston input module
        if: runner.os == 'Linux'
        run: |
          meson setup target/weston-input native/weston-input --prefix /usr --libdir lib -Dwerror=true
          meson compile -C target/weston-input

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --all-targets --locked

      - name: build
        run: cargo build --workspace --all-targets --locked

      - name: refuse ignored GPU tests on CI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if cargo test --workspace --all-targets -- --list --ignored --format terse 2>/dev/null | grep -qi 'requires-gpu'; then
            echo "GPU tests are listed as ignored (requires-gpu). CI will not execute them."
          fi
          echo "Skipping cargo test -- --ignored (would run requires-gpu on a CPU runner)."
