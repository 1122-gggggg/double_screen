name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          # cargo-audit 0.22 parses current RustSec CVSS 4.0 advisories and
          # has its own MSRV; application builds remain pinned to Rust 1.85.
          toolchain: '1.88.0'
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        # minifb 0.28 (latest) references unmaintained `instant` only for wasm32;
        # SplitDesk release targets are Linux, Windows, and macOS native builds.
        run: cargo audit --ignore RUSTSEC-2024-0384 --deny warnings
