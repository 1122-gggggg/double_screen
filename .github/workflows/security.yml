name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.21.2 --locked
      - name: Audit Cargo.lock
        # minifb 0.28 (latest) references unmaintained `instant` only for wasm32;
        # SplitDesk release targets are Linux, Windows, and macOS native builds.
        run: cargo audit --ignore RUSTSEC-2024-0384 --deny warnings
